baseURL = "https://blogs.rameskum.com"
locale = "en-us"
title = "1Stop"
theme = "PaperMod"

# Number of posts shown per paginated list page (was: 5 on the cactus home page)
# Note: the old top-level `paginate` key is ignored by modern Hugo; use [pagination]
[pagination]
  pagerSize = 5

# Comments via Disqus (see layouts/_partials/comments.html override)
# Analytics via Google (see layouts/_partials/google_analytics.html override)
[services.disqus]
  shortname = "rameskum"
[services.googleAnalytics]
  id = "G-MHRW0K00VZ"

enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"] # JSON output powers the built-in search page

# Main menu which appears in the site header.
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Writings"
url = "/posts/"
weight = 2

[[menu.main]]
name = "Tags"
url = "/tags/"
weight = 3

[[menu.main]]
name = "About"
url = "/about/"
weight = 4

[markup]
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = false # use PaperMod's chroma CSS so code blocks follow light/dark theme
    tabWidth = 4

[params]
  env = "production"
  description = "Welcome to your one-stop destination for all things tech! This website is designed to empower developers of all levels by providing insightful blogs, code snippets, and industry updates. Dive deep into the world of programming languages like Java and Shell Scripting, or stay ahead of the curve with articles exploring the latest advancements in Spring Boot."
  author = "Ramesh"
  DateFormat = "2006-01-02" # same date format as the old theme
  defaultTheme = "auto" # auto | dark | light
  comments = true # show the Disqus comment section on posts

  # Sections shown on the home page and in archives
  mainSections = ["posts"]

  # Post page settings
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true # table of contents on posts
  TocOpen = false

  # "Suggest Changes" link on every post, pointing at this repo
  [params.editPost]
    URL = "https://github.com/rameskum/rameskum-blogs/tree/main/content"
    Text = "Suggest Changes"
    appendFilePath = true

  # Hero block on the home page
  [params.homeInfoParams]
    Title = "1Stop"
    Content = "Welcome to your one-stop destination for all things tech! Insightful blogs, code snippets, and industry updates for developers of all levels — from Java and Spring Boot to Docker, Kafka, and AWS."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rameskum"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/rameskum"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:me@rameskum.com"
